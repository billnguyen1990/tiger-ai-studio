name: "Tiger AI • Nhắc Nhở NVXL Họp & Báo Cáo MT01 (08:00 AM T2 & T5)"

on:
  schedule:
    # 08:00 AM Việt Nam (UTC+7) = 01:00 UTC Thứ Hai & Thứ Năm hàng tuần
    - cron: '0 1 * * 1,4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bỏ qua kiểm tra thứ trong tuần (true/false để test thử)'
        required: false
        default: 'false'

concurrency:
  group: nvxl-meeting-reminder-08h
  cancel-in-progress: false

jobs:
  nvxl-reminder:
    name: "Nhắc Lịch Họp & Báo Cáo Định Kỳ 4 Kho MT01 (08:00 AM)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Tải mã nguồn repository
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Cài đặt thư viện requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🚀 Gửi thông báo nhắc họp NVXL lên Telegram Topic Báo Cáo
        env:
          TZ: Asia/Ho_Chi_Minh
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python tiger_nvxl_meeting_reminder.py --send --force
          else
            python tiger_nvxl_meeting_reminder.py --send
          fi
