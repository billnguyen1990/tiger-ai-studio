name: Tiger AI Automated Cloud Reporters

on:
  schedule:
    # 07:00 VN (00:00 UTC) - Báo cáo KPI GTC ca hôm trước
    - cron: '0 0 * * *'
    # 07:35 VN (00:35 UTC) - Báo cáo Điểm danh & Ca làm việc
    - cron: '35 0 * * *'
    # 09:00 VN (02:00 UTC) - Báo cáo Đã gán / Chưa gán sáng
    - cron: '0 2 * * *'
    # 10:00 VN (03:00 UTC) - Báo cáo Đơn chưa gán & Lưu kho 10h
    - cron: '0 3 * * *'
    # 12:00 VN (05:00 UTC) - Tiến độ giao hàng PDA trưa
    - cron: '0 5 * * *'
    # 15:00 VN (08:00 UTC) - Tiến độ giao hàng PDA chiều
    - cron: '0 8 * * *'
    # 19:00 VN (12:00 UTC) - Tiến độ giao hàng PDA tối
    - cron: '0 12 * * *'
    # 21:00 VN (14:00 UTC) - Báo cáo Chốt ca cuối ngày & COD
    - cron: '0 14 * * *'
    # 21:30 VN (14:30 UTC) - Rà soát nhắc nhở chốt ca 21h30
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      reporter:
        description: 'Chọn báo cáo muốn chạy ngay'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - gtc
          - checkin
          - assigned
          - unassigned
          - pda
          - evening

jobs:
  run-reporter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests pytz

      - name: Determine & Execute Scheduled Report
        run: |
          # Tính giờ Việt Nam (UTC + 7)
          VN_HOUR=$(TZ='Asia/Ho_Chi_Minh' date +%H)
          VN_MIN=$(TZ='Asia/Ho_Chi_Minh' date +%M)
          echo "Giờ Việt Nam hiện tại: ${VN_HOUR}:${VN_MIN}"

          MANUAL_CHOICE="${{ github.event.inputs.reporter }}"
          
          if [ "$MANUAL_CHOICE" = "gtc" ] || ([ -z "$MANUAL_CHOICE" ] && [ "$VN_HOUR" = "07" ] && [ "$VN_MIN" -lt "20" ]); then
            echo "🚀 Đang chạy Báo cáo KPI GTC (07:00)..."
            python tiger_gtc_kpi_reporter.py --send
          elif [ "$MANUAL_CHOICE" = "checkin" ] || ([ -z "$MANUAL_CHOICE" ] && [ "$VN_HOUR" = "07" ] && [ "$VN_MIN" -ge "20" ]); then
            echo "🚀 Đang chạy Báo cáo Điểm danh (07:35)..."
            python tiger_checkin_reporter.py --send
          elif [ "$MANUAL_CHOICE" = "assigned" ] || ([ -z "$MANUAL_CHOICE" ] && [ "$VN_HOUR" = "09" ]); then
            echo "🚀 Đang chạy Báo cáo Đã gán sáng (09:00)..."
            python tiger_morning_assigned_reporter.py --send
          elif [ "$MANUAL_CHOICE" = "unassigned" ] || ([ -z "$MANUAL_CHOICE" ] && [ "$VN_HOUR" = "10" ]); then
            echo "🚀 Đang chạy Báo cáo Đơn chưa gán & PDA 10:00..."
            python tiger_unassigned_backlog_reporter.py --send
            python tiger_pda_progress_reporter.py --send
          elif [ "$MANUAL_CHOICE" = "pda" ] || ([ -z "$MANUAL_CHOICE" ] && ([ "$VN_HOUR" = "12" ] || [ "$VN_HOUR" = "15" ] || [ "$VN_HOUR" = "19" ])); then
            echo "🚀 Đang chạy Báo cáo Tiến độ PDA (${VN_HOUR}:00)..."
            python tiger_pda_progress_reporter.py --send
          elif [ "$MANUAL_CHOICE" = "evening" ] || ([ -z "$MANUAL_CHOICE" ] && [ "$VN_HOUR" = "21" ]); then
            echo "🚀 Đang chạy Báo cáo Chốt ca cuối ngày (${VN_HOUR}:${VN_MIN})..."
            python tiger_evening_reporter.py --send
          elif [ "$MANUAL_CHOICE" = "all" ]; then
            echo "🚀 Chạy kiểm tra dry-run toàn bộ báo cáo..."
            python tiger_gtc_kpi_reporter.py
            python tiger_checkin_reporter.py
            python tiger_morning_assigned_reporter.py
            python tiger_unassigned_backlog_reporter.py
            python tiger_pda_progress_reporter.py
            python tiger_evening_reporter.py
          else
            echo "ℹ️ Khung giờ không trùng lịch cố định, kiểm tra tiến độ PDA..."
            python tiger_pda_progress_reporter.py --send
          fi
