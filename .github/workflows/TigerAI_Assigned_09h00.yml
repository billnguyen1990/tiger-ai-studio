name: "Tiger AI • Giám Sát Gán Chuyến Sáng MT01 (09:00 AM)"

on:
# [GitHub Cron Disabled - Dispatched precisely by Render Cloud]
#   schedule:
#     # 09:00 AM Việt Nam (UTC+7) = 02:00 UTC hàng ngày
#     - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Ngày kiểm tra YYYY-MM-DD hoặc YYYYMMDD (để trống = ngày hôm nay)'
        required: false
        default: ''

concurrency:
  group: assigned-mt01-09h00
  cancel-in-progress: false

jobs:
  assigned-mt01:
    name: "Quét Chuyến Xe & Đơn Hàng Xuất Bến Sáng 4 Kho MT01 (09:00 AM)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Tải mã nguồn repository
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Cài đặt thư viện requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🚀 Chạy báo cáo gán chuyến sáng & Gửi Telegram MT01
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python tiger_morning_assigned_reporter.py --date "${{ github.event.inputs.target_date }}" --send
          else
            python tiger_morning_assigned_reporter.py --send
          fi

