name: "Tiger AI • Cào Chuyến Đi Lastmile 4 Vùng Miền Tây (05:00 AM)"

on:
# [GitHub Cron Disabled - Dispatched precisely by Render Cloud]
#   schedule:
#     # 05:00 AM Việt Nam (UTC+7) = 22:00 UTC hôm trước
#     - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Ngày cào dữ liệu (để trống = tự động cào ngày hôm qua N-1)'
        required: false
        default: ''

concurrency:
  group: lastmile-4-vung-05h
  cancel-in-progress: false

jobs:
  scrape-lastmile-4-vung:
    name: "Cào 4 Vùng Trọng Điểm: MT01, MT02, MT04, MT05"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Tải mã nguồn repository
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Cài đặt thư viện requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🚀 Chạy cào dữ liệu 4 Vùng Miền Tây & Đồng bộ Sheets
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python tiger_lastmile_trips_scraper.py --date "${{ github.event.inputs.target_date }}"
          else
            python tiger_lastmile_trips_scraper.py
          fi
