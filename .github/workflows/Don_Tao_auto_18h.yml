name: "Tiger AI • Looker Studio B2B Cloud Automation (18:00)"

on:
  schedule:
    # 18:00 Việt Nam (UTC+7) = 11:00 UTC hàng ngày
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      headless:
        description: 'Chạy chế độ Headless'
        required: false
        default: 'true'
        type: string

concurrency:
  group: looker-b2b-export
  cancel-in-progress: false

jobs:
  run-looker-b2b:
    name: "Cào Looker Studio B2B & Đồng bộ Google Sheets"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Tải mã nguồn repository
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt môi trường Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Cài đặt thư viện Python & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright requests
          playwright install --with-deps chromium

      - name: 🔑 Nạp phiên đăng nhập Google từ GitHub Secret
        env:
          GOOGLE_AUTH_STORAGE: ${{ secrets.GOOGLE_AUTH_STORAGE }}
        run: |
          if [ -z "$GOOGLE_AUTH_STORAGE" ]; then
            echo "::error::Secret GOOGLE_AUTH_STORAGE chưa được thiết lập!"
            exit 1
          fi
          echo "$GOOGLE_AUTH_STORAGE" > google_auth_storage.json
          echo "✅ Đã nạp thành công phiên xác thực Google vào google_auth_storage.json"

      - name: 🚀 Chạy quy trình Cào Looker Studio B2B (Xvfb Virtual 1080p Display)
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_ACTIONS: "true"
          TELEGRAM_BOT_TOKEN: "8777045986:AAEX1uau8GFdxPAj0aAVUwDNQnpQb1IZOIA"
          TELEGRAM_CHAT_ID: "-1003940889949"
          TELEGRAM_THREAD_ID: "2690"
        run: |
          xvfb-run -s "-screen 0 1920x1080x24" python looker_export_temp.py --headless

      - name: 📸 Lưu ảnh màn hình sự cố nếu gặp lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: looker-b2b-error-screenshots
          path: |
            *.png
            debug_dom.html
          retention-days: 7
