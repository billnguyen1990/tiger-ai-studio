name: "Tiger AI • Đối Soát ODO Xe Tải 365 Toàn Miền Tây (02:00 AM)"

on:
# [GitHub Cron Disabled - Dispatched precisely by Render Cloud]
#   schedule:
#     # 02:00 AM Việt Nam (UTC+7) = 19:00 UTC hôm trước
#     - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Ngày cào dữ liệu YYYY-MM-DD hoặc YYYYMMDD (để trống = tự động cào ngày hôm qua N-1)'
        required: false
        default: ''

concurrency:
  group: truck-odo-02h
  cancel-in-progress: false

jobs:
  scrape-truck-odo:
    name: "Quét ODO Xe Tải 365 Cho 21 Kho Miền Tây"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Tải mã nguồn repository
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Cài đặt thư viện requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🚀 Chạy cào ODO Xe Tải 365, Đồng Bộ Sheets & Gửi Telegram
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python tiger_truck_odo_reporter.py --fast --date "${{ github.event.inputs.target_date }}"
          else
            python tiger_truck_odo_reporter.py --fast
          fi

