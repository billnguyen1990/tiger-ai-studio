name: "Tiger AI • Báo Cáo KPI Giao & Lấy Hàng MT01 (07:00 AM)"

on:
  schedule:
    # 07:00 AM Việt Nam (UTC+7) = 00:00 UTC hàng ngày
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Ngày tính KPI YYYYMMDD (để trống = tự động tính ngày hôm qua N-1)'
        required: false
        default: ''

concurrency:
  group: kpi-mt01-07h
  cancel-in-progress: false

jobs:
  report-kpi-mt01:
    name: "Tổng Hợp KPI Giao & Lấy 4 Kho MT01 (Cái Răng, Bình Thủy, Vị Thanh, Ô Môn)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Tải mã nguồn repository
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Cài đặt thư viện requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🚀 Chạy báo cáo KPI MT01 & Gửi Telegram
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python tiger_gtc_kpi_reporter.py --date "${{ github.event.inputs.target_date }}" --send
          else
            python tiger_gtc_kpi_reporter.py --send
          fi

